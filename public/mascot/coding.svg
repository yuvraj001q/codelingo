<svg viewBox="0 0 120 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Antenna -->
  <rect x="56" y="5" width="8" height="8" rx="2" fill="#4A90D9"/>
  <circle cx="60" cy="4" r="5" fill="#FFD700"/>
  <circle cx="58" cy="3" r="2" fill="white" opacity="0.6"/>

  <!-- Code symbols floating -->
  <text x="88" y="16" font-family="monospace" font-size="8" font-weight="bold" fill="#4ADE80" opacity="0.8">&lt;/&gt;</text>
  <text x="18" y="38" font-family="monospace" font-size="7" font-weight="bold" fill="#FFD700" opacity="0.6">{ }</text>

  <!-- Hood -->
  <path d="M40 42 Q40 15 60 13 Q80 15 80 42 L82 95 L38 95 Z" fill="#F0F5FF"/>
  <path d="M40 42 Q40 17 60 15 Q80 17 80 42" fill="#D0E0F0" opacity="0.5"/>

  <!-- Hoody body -->
  <rect x="35" y="48" width="50" height="52" rx="10" fill="#F0F5FF"/>
  <rect x="35" y="48" width="50" height="52" rx="10" fill="none" stroke="#D0E0F0" stroke-width="1.5"/>

  <!-- Gold zipper -->
  <line x1="60" y1="48" x2="60" y2="100" stroke="#FFD700" stroke-width="2"/>

  <!-- Drawstrings -->
  <path d="M45 46 Q42 55 44 60" stroke="#D0E0F0" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <circle cx="44" cy="60" r="2" fill="#C0D0E0"/>
  <path d="M75 46 Q78 55 76 60" stroke="#D0E0F0" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <circle cx="76" cy="60" r="2" fill="#C0D0E0"/>

  <!-- Robot head -->
  <circle cx="60" cy="30" r="15" fill="#4A90D9"/>
  <circle cx="60" cy="30" r="15" fill="none" stroke="#3A7BC8" stroke-width="1"/>
  <path d="M50 22 Q55 18 62 20" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Headphones -->
  <path d="M40 28 Q40 10 60 8 Q80 10 80 28" stroke="#2C2C3E" stroke-width="3" fill="none"/>
  <rect x="36" y="26" width="8" height="14" rx="4" fill="#2C2C3E"/>
  <rect x="76" y="26" width="8" height="14" rx="4" fill="#2C2C3E"/>
  <rect x="38" y="28" width="4" height="10" rx="2" fill="#4ADE80" opacity="0.5"/>
  <rect x="78" y="28" width="4" height="10" rx="2" fill="#4ADE80" opacity="0.5"/>

  <!-- Coding glasses (floating over eyes) -->
  <rect x="42" y="23" width="18" height="12" rx="3" fill="none" stroke="#FFD700" stroke-width="1.5"/>
  <rect x="60" y="23" width="18" height="12" rx="3" fill="none" stroke="#FFD700" stroke-width="1.5"/>
  <line x1="60" y1="29" x2="60" y2="29" stroke="#FFD700" stroke-width="1.5"/>

  <!-- Anime eyes - focused -->
  <!-- Left eye -->
  <ellipse cx="51" cy="29" rx="5" ry="6" fill="white"/>
  <ellipse cx="51" cy="29" rx="3.5" ry="4.5" fill="#1a1a2e"/>
  <circle cx="49" cy="27" r="1.5" fill="white"/>
  <!-- Right eye -->
  <ellipse cx="69" cy="29" rx="5" ry="6" fill="white"/>
  <ellipse cx="69" cy="29" rx="3.5" ry="4.5" fill="#1a1a2e"/>
  <circle cx="67" cy="27" r="1.5" fill="white"/>

  <!-- Eyebrows - focused/concentrating -->
  <path d="M43 19 Q50 16 56 19" stroke="#1a1a2e" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M64 19 Q70 16 77 19" stroke="#1a1a2e" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Mouth - slight smile -->
  <path d="M56 36 Q60 39 64 36" stroke="#1a1a2e" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Arms - typing pose -->
  <!-- Left arm angled down -->
  <rect x="18" y="55" width="16" height="8" rx="4" fill="#4A90D9" transform="rotate(-10 26 59)"/>
  <circle cx="16" cy="62" r="6" fill="#5BA0E6"/>
  <!-- Right arm angled down -->
  <rect x="86" y="55" width="16" height="8" rx="4" fill="#4A90D9" transform="rotate(10 94 59)"/>
  <circle cx="104" cy="62" r="6" fill="#5BA0E6"/>

  <!-- Floating code lines -->
  <rect x="28" y="82" width="18" height="3" rx="1.5" fill="#4A90D9" opacity="0.3"/>
  <rect x="28" y="88" width="12" height="3" rx="1.5" fill="#4A90D9" opacity="0.2"/>
  <rect x="74" y="82" width="18" height="3" rx="1.5" fill="#4A90D9" opacity="0.3"/>
  <rect x="74" y="88" width="12" height="3" rx="1.5" fill="#4A90D9" opacity="0.2"/>

  <!-- Legs -->
  <rect x="44" y="100" width="12" height="16" rx="4" fill="#4A90D9"/>
  <rect x="42" y="112" width="16" height="8" rx="4" fill="#3A7BC8"/>
  <rect x="64" y="100" width="12" height="16" rx="4" fill="#4A90D9"/>
  <rect x="62" y="112" width="16" height="8" rx="4" fill="#3A7BC8"/>

  <!-- Ground shadow -->
  <ellipse cx="60" cy="122" rx="30" ry="3" fill="rgba(0,0,0,0.08)"/>
</svg>
